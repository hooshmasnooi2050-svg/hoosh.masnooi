<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوش مصنوعی من</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 40px 20px;
    }

    .card {
      background: #1e293b;
      width: 250px;
      padding: 30px 20px;
      border-radius: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <header>
    <h1>🤖 هوش مصنوعی من</h1>
    <p>ساخت عکس، ویدئو و آواتار با هوش مصنوعی</p>
  </header>
<section style="
  max-width: 420px;
  margin: 25px auto;
  padding: 25px;
  background: #1e293b;
  border-radius: 18px;
  text-align: center;
">

  <h2 style="margin-bottom: 20px;">حساب کاربری</h2>

  <input
    type="email"
    placeholder="ایمیل"
    style="
      width: 90%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    "
  >

  <input
    type="password"
    placeholder="رمز عبور"
    style="
      width: 90%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    "
  >

  <div style="margin-top: 15px;">

    <button
      onclick="alert('ورود به‌زودی فعال می‌شود')"
      style="
        padding: 11px 25px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background: #6366f1;
        color: white;
        cursor: pointer;
      "
    >
      ورود
    </button>

    <button
      onclick="alert('ثبت‌نام به‌زودی فعال می‌شود')"
      style="
        padding: 11px 25px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        cursor: pointer;
      "
    >
      ثبت‌نام
    </button>

  </div>

</section>
  <div class="container">

    <div class="card">
      <h2>🖼 ساخت عکس</h2>
      <p>با هوش مصنوعی تصویر بسازید.</p>
      <button>شروع ساخت عکس</button>
    </div>

    <div class="card">
      <h2>:clapper: ساخت ویدئو</h2>
      <p>با هوش مصنوعی ویدئو تولید کنید.</p>
      <button>شروع ساخت ویدئو</button>
    </div>

    <div class="card">
      <h2>:bust_in_silhouette: ساخت آواتار</h2>
      <p>آواتار هوش مصنوعی خودتان را بسازید.</p>
      <button>شروع ساخت آواتار</button>
    </div>

  </div>

</body>
</html>
