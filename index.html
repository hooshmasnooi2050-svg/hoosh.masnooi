<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هوش مصنوعی من</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    /* حساب کاربری */

    .account-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 250px;
      padding: 18px;
      background: #1e293b;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .account-box h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .account-box input {
      width: 100%;
      padding: 9px;
      margin: 5px 0;
      border: none;
      border-radius: 7px;
    }

    .account-buttons {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 8px;
    }

    .account-buttons button {
      padding: 8px 13px;
      border: none;
      border-radius: 7px;
      color: white;
      cursor: pointer;
    }

    .login-button {
      background: #6366f1;
    }

    .signup-button {
      background: #22c55e;
    }

    .logout-button {
      background: #ef4444;
      width: 100%;
    }

    .account-message {
      font-size: 13px;
      margin-top: 10px;
      color: #cbd5e1;
    }

    .user-email {
      color: #86efac;
      font-size: 14px;
      word-break: break-word;
      margin-bottom: 10px;
    }

    /* کارت‌ها */

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 40px 20px;
    }

    .card {
      background: #1e293b;
      width: 280px;
      padding: 30px 20px;
      border-radius: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .card button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* ساخت عکس */

    #imageGenerator {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 20px;
    }

    #imagePrompt {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      resize: vertical;
      font-size: 16px;
      margin-bottom: 12px;
    }

    #generateImageBtn {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    #imageStatus {
      margin-top: 15px;
      color: #cbd5e1;
    }

    #generatedImage {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      .account-box {
        position: relative;
        top: auto;
        right: auto;
        margin: 15px auto;
      }

      header {
        padding-top: 25px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- حساب کاربری -->

  <div class="account-box">

    <div id="loginForm">

      <h2>👤 حساب کاربری</h2>

      <input
        id="email"
        type="email"
        placeholder="ایمیل"
      >

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
      >

      <div class="account-buttons">

        <button
          id="loginBtn"
          class="login-button"
        >
          ورود
        </button>

        <button
          id="signupBtn"
          class="signup-button"
        >
          ثبت‌نام
        </button>

      </div>

      <div
        id="accountMessage"
        class="account-message"
      ></div>

    </div>


    <div id="userPanel" style="display:none;">

      <h2>👋 خوش آمدید</h2>

      <div
        id="userEmail"
        class="user-email"
      ></div>

      <button
        id="logoutBtn"
        class="account-buttons logout-button"
      >
        خروج از حساب
      </button>

    </div>

  </div>


  <!-- عنوان -->

  <header>

    <h1>🤖 هوش مصنوعی من</h1>

    <p>
      ساخت عکس، ویدئو و آواتار با هوش مصنوعی
    </p>

  </header>


  <!-- ابزار ساخت عکس -->

  <section id="imageGenerator">

    <h2>🖼️ ساخت عکس با هوش مصنوعی</h2>

    <p>
      توضیح بده چه تصویری می‌خواهی بسازی.
    </p>

    <textarea
      id="imagePrompt"
      placeholder="مثلاً: یک گربه سفید در یک شهر آینده‌نگر، سبک سینمایی"
    ></textarea>

    <br>

    <button id="generateImageBtn">
      ساخت تصویر
    </button>

    <div id="imageStatus"></div>

    <img
      id="generatedImage"
      alt="تصویر تولید شده"
    >

  </section>


  <!-- امکانات -->

  <div class="container">

    <div class="card">

      <h2>🖼️ ساخت عکس</h2>

      <p>
        با هوش مصنوعی تصویر بسازید.
      </p>

      <button id="openImageGenerator">
        شروع ساخت عکس
      </button>

    </div>


    <div class="card">

      <h2>🎬 ساخت ویدئو</h2>

      <p>
        با هوش مصنوعی ویدئو تولید کنید.
      </p>

      <button>
        به‌زودی
      </button>

    </div>


    <div class="card">

      <h2>👤 ساخت آواتار</h2>

      <p>
        آواتار هوش مصنوعی خودتان را بسازید.
      </p>

      <button>
        به‌زودی
      </button>

    </div>

  </div>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://bqhyuqwtzoafohhdvgqz.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_L-WnuAdqQJPsHvm5y_aGCA_R0eMmwCC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const accountMessage =
      document.getElementById("accountMessage");

    const loginForm =
      document.getElementById("loginForm");

    const userPanel =
      document.getElementById("userPanel");

    const userEmail =
      document.getElementById("userEmail");


    /* وضعیت کاربر */

    async function updateUserInterface() {

      const {
        data: {
          user
        }
      } = await supabaseClient.auth.getUser();


      if (user) {

        loginForm.style.display = "none";

        userPanel.style.display = "block";

        userEmail.textContent =
          user.email;

      } else {

        loginForm.style.display = "block";

        userPanel.style.display = "none";

      }
    }


    /* ثبت نام */

    signupBtn.addEventListener(
      "click",
      async function () {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          accountMessage.textContent =
            "لطفاً ایمیل و رمز عبور را وارد کنید.";

          return;
        }


        if (password.length < 6) {

          accountMessage.textContent =
            "رمز عبور باید حداقل ۶ کاراکتر باشد.";

          return;
        }


        accountMessage.textContent =
          "در حال ثبت‌نام...";


        const {
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              emailRedirectTo:
                window.location.origin

            }

          });


        if (error) {

          accountMessage.textContent =
            "خطا: " + error.message;

          return;
        }


        accountMessage.textContent =
          "ثبت‌نام انجام شد. ایمیل خود را بررسی کنید.";

      }
    );


    /* ورود */

    loginBtn.addEventListener(
      "click",
      async function () {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          accountMessage.textContent =
            "لطفاً ایمیل و رمز عبور را وارد کنید.";

          return;
        }


        accountMessage.textContent =
          "در حال ورود...";


        const {
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          accountMessage.textContent =
            "خطا: " + error.message;

          return;
        }


        accountMessage.textContent =
          "ورود موفق بود.";

        await updateUserInterface();

      }
    );


    /* خروج */

    logoutBtn.addEventListener(
      "click",
      async function () {

        await supabaseClient.auth.signOut();

        await updateUserInterface();

      }
    );


    /* بررسی ورود */

    supabaseClient.auth.onAuthStateChange(
      async function () {

        await updateUserInterface();

      }
    );


    updateUserInterface();


    /* باز کردن ابزار ساخت عکس */

    document
      .getElementById("openImageGenerator")
      .addEventListener(
        "click",
        async function () {

          const {
            data: {
              user
            }
          } =
            await supabaseClient.auth.getUser();


          if (!user) {

            alert(
              "برای ساخت عکس ابتدا وارد حساب خود شوید."
            );

            return;
          }


          document
            .getElementById("imageGenerator")
            .style.display = "block";


          document
            .getElementById("imageGenerator")
            .scrollIntoView({
              behavior: "smooth"
            });

        }
      );


    /* ساخت عکس */

    document
      .getElementById("generateImageBtn")
      .addEventListener(
        "click",
        async function () {

          const prompt =
            document
              .getElementById("imagePrompt")
              .value
              .trim();

          const status =
            document
              .getElementById("imageStatus");

          const image =
            document
              .getElementById("generatedImage");


          if (!prompt) {

            status.textContent =
              "اول توضیح تصویر را بنویس.";

            return;
          }


          status.textContent =
            "در حال ساخت تصویر...";

          image.style.display = "none";


          try {

            const response =
              await fetch(
                "/.netlify/functions/generate-image",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    prompt: prompt
                  })

                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              throw new Error(
                data.error ||
                "ساخت تصویر ناموفق بود."
              );

            }


            let imageData = null;


            if (
              data.candidates &&
              data.candidates[0] &&
              data.candidates[0].content &&
              data.candidates[0].content.parts
            ) {

              for (
                const part
                of data.candidates[0].content.parts
              ) {

                if (
                  part.inlineData &&
                  part.inlineData.data
                ) {

                  imageData =
                    part.inlineData.data;

                  break;

                }

              }

            }


            if (!imageData) {

              throw new Error(
                "تصویری از سرویس دریافت نشد."
              );

            }


            image.src =
              "data:image/png;base64," +
              imageData;

            image.style.display =
              "block";

            status.textContent =
              "تصویر با موفقیت ساخته شد.";

          } catch (error) {

            status.textContent =
              "خطا: " +
              error.message;

          }

        }
      );

  </script>

</body>
</html>
